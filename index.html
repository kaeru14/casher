<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPay 支払い</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #dcdcdc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      color: #333;
    }

    .app-header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      color: white;
    }
    .app-header h1 { font-size: 1.1rem; font-weight: bold; }
    .app-header .material-symbols-outlined { font-size: 24px; cursor: pointer; }

    .main-container {
      width: 100%;
      max-width: 400px;
      padding: 0 12px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pay-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
    }

    .qrcode-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 8px;
    }
    #qrcode { display: flex; justify-content: center; min-height: 140px; align-items: center; }
    
    .timer-text { font-size: 0.8rem; color: #007aff; display: flex; justify-content: center; align-items: center; gap: 4px; margin-bottom: 16px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background-color: #f9f9fb;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .info-row-left { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem; }
    .info-row-right { font-weight: bold; font-size: 1rem; color: #222; }

    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #007aff; }
    input:checked + .slider:before { transform: translateX(20px); }

    .history-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .history-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #333;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .history-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .history-item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .history-store {
      font-weight: bold;
      font-size: 0.9rem;
      color: #222;
    }
    .history-date {
      font-size: 0.75rem;
      color: #888;
    }
    .history-amount {
      font-weight: bold;
      font-size: 0.95rem;
      color: #333;
    }
    .more-btn {
      width: 100%;
      background: none;
      border: none;
      color: #007aff;
      font-weight: bold;
      font-size: 0.85rem;
      padding-top: 12px;
      margin-top: 8px;
      border-top: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <span class="material-symbols-outlined">arrow_back_ios</span>
    <h1>支払い</h1>
    <span class="material-symbols-outlined">help</span>
  </div>

  <div class="main-container">
    <div class="pay-card">
      <div class="qrcode-wrapper">
        <div id="qrcode"></div>
      </div>

      <div class="timer-text">
        <span id="qrStatusText">レジの準備を待っています...</span>
        <span class="material-symbols-outlined" style="font-size:16px;">refresh</span>
      </div>

      <div class="info-row">
        <span style="font-size: 0.85rem; color: #666;">利用可能額</span>
        <span class="info-row-right">¥<span id="displayBalance">0</span></span>
      </div>

      <div class="info-row" style="background: white; border: 1px solid #eee;">
        <div class="info-row-left">
          <span class="material-symbols-outlined" style="color:#007aff;">account_balance_wallet</span>
          <div>
            <div>PayPay残高</div>
            <div style="font-size:0.75rem; color:#888; font-weight:normal;">残高連携中</div>
          </div>
        </div>
        <span class="material-symbols-outlined" style="color:#ccc;">chevron_right</span>
      </div>

      <div class="switch-row">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="color:#ff3b30; font-weight:bold;">P</span>
          <span>PayPayポイントを使う</span>
          <span style="color:#888; font-size:0.8rem; margin-left:4px;">0 pt</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="history-card">
      <div class="history-title">
        <span class="material-symbols-outlined" style="color:#ff3b30; font-size:20px;">history</span>
        利用履歴
      </div>
      <div class="history-list" id="historyList">
        <div style="font-size:0.85rem; color:#888; text-align:center;">読み込み中...</div>
      </div>
      <button class="more-btn" id="showMoreBtn" style="display: none;">
        <span>さらに表示</span>
        <span class="material-symbols-outlined" style="font-size: 18px;">expand_more</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, getDoc, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhgPybPJ_boAQ1CdEDgnfk2b1_U7a2L_o",
      authDomain: "call-system-838c7.firebaseapp.com",
      projectId: "call-system-838c7"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const urlParams = new URLSearchParams(window.location.search);
    const userNameParam = urlParams.get('name') || "test";

    const casherRef = doc(db, "casher", "pineapple");
    const userDocRef = doc(db, "user", userNameParam);

    let qrCodeObj = null;
    let allHistoryDocs = [];

    // 1. QRコード描画・更新関数
    function updateQRCode(token) {
      const qrcodeContainer = document.getElementById("qrcode");
      const qrData = `${userNameParam}:${token}`;
      
      if (!qrCodeObj) {
        qrcodeContainer.innerHTML = "";
        qrCodeObj = new QRCode(qrcodeContainer, {
          text: qrData,
          width: 140,
          height: 140,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
      } else {
        qrCodeObj.clear();
        qrCodeObj.makeCode(qrData);
      }
    }

    // 2. ユーザー情報の取得・監視
    onSnapshot(userDocRef, (snap) => {
      if (snap.exists()) {
        const bal = snap.data().balance || 0;
        document.getElementById("displayBalance").innerText = Number(bal).toLocaleString();
      }
    });

    // 3. 利用履歴の取得
    async function fetchHistory() {
      const historyRef = collection(db, "user", userNameParam, "history");
      const q = query(historyRef, orderBy("timestamp", "desc"));
      
      try {
        const querySnap = await getDocs(q);
        allHistoryDocs = querySnap.docs.map(d => d.data());
        
        if (allHistoryDocs.length === 0) {
          document.getElementById("historyList").innerHTML = '<div style="font-size:0.85rem; color:#888; text-align:center;">履歴はありません</div>';
          return;
        }

        renderHistoryList(5);

        if (allHistoryDocs.length > 5) {
          document.getElementById("showMoreBtn").style.display = "flex";
        }
      } catch (err) {
        console.error("履歴取得エラー:", err);
        document.getElementById("historyList").innerHTML = '<div style="font-size:0.85rem; color:#888; text-align:center;">履歴の読み込みに失敗しました</div>';
      }
    }

    function renderHistoryList(limitCount) {
      const container = document.getElementById("historyList");
      container.innerHTML = "";

      const itemsToRender = limitCount ? allHistoryDocs.slice(0, limitCount) : allHistoryDocs;

      itemsToRender.forEach(item => {
        const amount = Number(item.amount || 0).toLocaleString();
        let dateStr = "日時不明";
        if (item.timestamp) {
          const d = item.timestamp.toDate();
          dateStr = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        const storeName = item.info || item.storeName || "パイナップルレジ";

        const itemEl = document.createElement("div");
        itemEl.className = "history-item";
        itemEl.innerHTML = `
          <div class="history-item-left">
            <div class="history-store">${storeName}</div>
            <div class="history-date">${dateStr}</div>
          </div>
          <div class="history-amount">- ¥${amount}</div>
        `;
        container.appendChild(itemEl);
      });
    }

    document.getElementById("showMoreBtn").addEventListener("click", () => {
      renderHistoryList(null);
      document.getElementById("showMoreBtn").style.display = "none";
    });

    fetchHistory();

    // 4. レジ状態（casher）の監視とQRコード生成・遷移判定
    onSnapshot(casherRef, (snapshot) => {
      if (!snapshot.exists()) return;
      const data = snapshot.data();

      // 決済完了時
      if (data.settle === true) {
        window.location.href = `success.html?name=${encodeURIComponent(userNameParam)}`;
        return;
      }

      // 会計中かつワンタイムトークンが存在する場合
      if (data.work === true && data.token) {
        updateQRCode(data.token);
        document.getElementById("qrStatusText").innerText = "コードをカメラにかざしてください";
      } else {
        document.getElementById("qrStatusText").innerText = "レジの操作をお待ちください";
      }
    });

  </script>
</body>
</html>
