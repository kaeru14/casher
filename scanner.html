<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レジシステム起動</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1c1c1e;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .icon { font-size: 80px; color: #007aff; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: #8e8e93; margin-bottom: 32px; max-width: 400px; line-height: 1.5; }
    .start-btn {
      background-color: #007aff;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      transition: transform 0.1s, background-color 0.2s;
    }
    .start-btn:active { transform: scale(0.96); background-color: #0062cc; }
  </style>
</head>
<body>

  <span class="material-symbols-outlined icon">photo_camera</span>
  <h1>客用レジシステム起動</h1>
  <p>QRコード決済を開始するには、下のボタンを押してカメラの使用を許可してください。</p>

  <button class="start-btn" id="startAppBtn">
    <span class="material-symbols-outlined">videocam</span>
    カメラを許可して開始
  </button>

  <script>
    document.getElementById("startAppBtn").addEventListener("click", async () => {
      try {
        // 事前にカメラ権限のリクエストを送信して許可を得る
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        
        // 許可が得られたらストリームをすぐに停止してスキャナー画面へ遷移
        stream.getTracks().forEach(track => track.stop());
        
        // scanner.html へ遷移
        window.location.href = "scanner.html";
      } catch (err) {
        alert("カメラの利用が許可されませんでした。ブラウザの設定でカメラを許可してください。");
        console.error(err);
      }
    });
  </script>

</body>
</html>
